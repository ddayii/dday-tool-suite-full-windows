name: Build installer

# Builds every EXE, compiles the Inno Setup installer, and opens a draft
# release with the installer attached. The release is left as a draft on
# purpose: someone reads the notes and clicks Publish. Drop the --draft flag
# in the last step to publish straight away.
#
# Two ways in:
#   * push a v* tag, or
#   * Actions > Build installer > Run workflow, giving the tag to cut.
#     The runner creates the tag itself, which is also the way to release
#     from an environment that cannot push tags.
#
# Running it manually with the tag left blank just builds and uploads the
# installer as a run artifact, creating no tag and no release.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to create and release, e.g. v2.2.0. Leave blank to build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Work out which tag, if any, this run is cutting
        id: release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSHED_TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:EVENT_NAME -eq 'push') { $env:PUSHED_TAG } else { "$env:INPUT_TAG".Trim() }

          if ($tag -and $tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag '$tag' is not of the form v1.2.3."
          }

          Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
          if ($tag) { Write-Host "Cutting $tag" } else { Write-Host "Build only, no release" }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install pyside6 pyinstaller openpyxl

      # The suite states its version in four places. They have drifted apart
      # before, so a mismatch fails here rather than shipping an installer
      # whose filename disagrees with the version inside it.
      - name: Check the tag matches the version in the source
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          $expected = $env:RELEASE_TAG -replace '^v', ''

          $sources = [ordered]@{
            'dday_controls_common.py' = 'APP_VERSION\s*=\s*"([\d.]+)"'
            'installer.iss'           = '#define AppVersion\s+"([\d.]+)"'
            'build_all.bat'           = 'Setup ([\d.]+)\.exe'
            'README.md'               = '\*\*Version:\*\* ([\d.]+)'
          }

          $mismatched = $false
          foreach ($file in $sources.Keys) {
            $hit = Select-String -Path $file -Pattern $sources[$file] | Select-Object -First 1
            if (-not $hit) {
              Write-Host "::error file=$file::no version string found"
              $mismatched = $true
              continue
            }

            $found = $hit.Matches[0].Groups[1].Value
            if ($found -ne $expected) {
              Write-Host "::error file=$file::states $found but the tag is $env:RELEASE_TAG"
              $mismatched = $true
            } else {
              Write-Host "$file -> $found"
            }
          }

          if ($mismatched) { exit 1 }

      # cmd, not pwsh: the batch file signals failure through ERRORLEVEL, and
      # CALL is what guarantees that errorlevel comes back to the runner.
      - name: Build the executables
        shell: cmd
        run: call build_all.bat

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compile the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }

          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with $LASTEXITCODE" }

      - name: Verify an installer came out
        shell: pwsh
        run: |
          $exe = Get-ChildItem installer\*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "Inno Setup produced no installer in installer\" }
          Write-Host "built $($exe.Name)  ($([math]::Round($exe.Length / 1MB)) MB)"

      # Kept on the run itself so a manual build is downloadable without a
      # release, and so a tagged build survives a discarded draft.
      - name: Attach the installer to this run
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: installer/*.exe
          retention-days: 14

      - name: Open a draft release
        if: steps.release.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $exe = Get-ChildItem installer\*.exe | Select-Object -First 1

          # --target creates the tag at this commit when it does not exist yet,
          # which is what lets a manual run cut a release.
          gh release create $env:RELEASE_TAG $exe.FullName `
            --title $env:RELEASE_TAG `
            --target $env:RELEASE_SHA `
            --generate-notes `
            --draft
